# Runs the LambdaTest iOS suite for `mobile-views-2` on a REAL PHYSICAL DEVICE.
#
# Sibling of wdio-mobile-views-2.yml, which runs the same specs on a VIRTUAL
# device. Differences that matter:
#   - the app under test is a SIGNED .ipa (see
#     uploadApp-mobile-views-2-realdevice.yml), not a simulator .app zip
#   - the suite runs sequentially (wdio-config-ios-realdevice.js sets
#     maxInstances: 1) because real-device concurrency is scarce
#
# The LambdaTest app ID arrives as a workflow_call INPUT from
# uploadApp-mobile-views-2-realdevice.yml, not as a downloaded artifact. That is
# deliberate: consuming an artifact produced by another workflow run is the
# "artifact poisoning" pattern, whereas a workflow_call input is passed in-run
# from a job output in this repo.
#
# Runs are identified in the LambdaTest automation dashboard by LT_RUN_LABEL,
# which wdio-config-ios-realdevice.js turns into:
#   - build name: "[mobile-views-2-realdevice] Build_NRTestApp_RealDevice - iOS:<timestamp>"
#   - "mobile-views-2-realdevice" and "real-device" tag chips (filterable)

name: "WDIO: automate iOS tests on real device (mobile-views-2)"

permissions:
  contents: read

on:
  # Chained from uploadApp-mobile-views-2-realdevice.yml once the IPA is uploaded.
  workflow_call:
    inputs:
      app_id:
        description: "LambdaTest custom_id of the signed IPA to test."
        required: false
        type: string
        default: ""

  # enables option for workflow to be manually executed in Github UI
  workflow_dispatch:
    inputs:
      app_id:
        description: "LambdaTest custom_id of a signed IPA already uploaded to LambdaTest. Required in practice: LambdaTest/last-app-id-realdevice is not tracked in git, so a blank value fails fast unless you have committed that file."
        required: false
        type: string
        default: ""
      device_name:
        description: "Real device to target (default iPhone 17)."
        required: false
        type: string
        default: ""
      platform_version:
        description: "iOS version to target (default 26.0)."
        required: false
        type: string
        default: ""

jobs:
  ios-data-realdevice:
    name: Generate iOS data on real device (mobile-views-2)
    runs-on: ubuntu-latest
    env:
      LT_USERNAME: ${{ secrets.LAMBDA_USERNAME }}
      LT_ACCESSKEY: ${{ secrets.LAMBDA_ACCESS_KEY }}
      # Surfaces this run as "[mobile-views-2-realdevice] ..." + tag chips in the
      # LambdaTest dashboard
      LT_RUN_LABEL: mobile-views-2-realdevice
    steps:
      - uses: actions/checkout@1e31de5234b9f8995739874a8ce0492dc87873e2 # pin@v4
        with:
          ref: mobile-views-2
      - name: Setup environment
        uses: ./.github/actions/env-setup

      # Validate before use. The value is repo-controlled (job output or a
      # dispatch by someone with write access), but a bad value would otherwise
      # flow into $GITHUB_ENV, so keep the allowlist tight.
      - name: Set LT_APP_ID environment variable
        env:
          APP_ID_INPUT: ${{ inputs.app_id }}
        run: |
          if [ -z "$APP_ID_INPUT" ]; then
            # last-app-id-realdevice is written by the upload script and is NOT
            # tracked in git, so it is normally absent in a fresh checkout. The
            # wdio config throws a clear error in that case rather than falling
            # back to a stale hardcoded app id.
            echo "No app ID supplied; falling back to LambdaTest/last-app-id-realdevice (absent unless committed)"
          # Two shapes are legal: an `lt://APP...` app URL (what LambdaTest returns
          # for a real-device upload, and what a real-device session needs) or a
          # dotted custom_id. The virtual pipeline's allowlist had no "/" and so
          # silently rejected every lt:// id.
          elif printf '%s' "$APP_ID_INPUT" | grep -Eq '^(lt://[A-Za-z0-9]{1,190}|[A-Za-z0-9._:-]{1,200})$'; then
            echo "LT_APP_ID=$APP_ID_INPUT" >> "$GITHUB_ENV"
            echo "Using app ID: $APP_ID_INPUT"
          else
            echo "Supplied app ID is invalid; falling back to LambdaTest/last-app-id-realdevice (absent unless committed)"
          fi

      # Optional hardware overrides. Same allowlist reasoning as the app ID:
      # these reach $GITHUB_ENV, so reject anything that is not a plain
      # device/version string.
      - name: Set device overrides
        env:
          DEVICE_NAME_INPUT: ${{ inputs.device_name }}
          PLATFORM_VERSION_INPUT: ${{ inputs.platform_version }}
        run: |
          if [ -n "$DEVICE_NAME_INPUT" ]; then
            if printf '%s' "$DEVICE_NAME_INPUT" | grep -Eq '^[A-Za-z0-9 ._-]{1,40}$'; then
              echo "LT_DEVICE_NAME=$DEVICE_NAME_INPUT" >> "$GITHUB_ENV"
              echo "Targeting device: $DEVICE_NAME_INPUT"
            else
              echo "::warning::Ignoring invalid device_name; using the config default"
            fi
          fi
          if [ -n "$PLATFORM_VERSION_INPUT" ]; then
            if printf '%s' "$PLATFORM_VERSION_INPUT" | grep -Eq '^[0-9.]{1,10}$'; then
              echo "LT_PLATFORM_VERSION=$PLATFORM_VERSION_INPUT" >> "$GITHUB_ENV"
              echo "Targeting iOS: $PLATFORM_VERSION_INPUT"
            else
              echo "::warning::Ignoring invalid platform_version; using the config default"
            fi
          fi

      - name: Execute iOS tests on real device
        run: npm run test:wdio-ios-realdevice

      - name: Read test results
        if: ${{ always() }}
        run: |
          RESULTS_FILE="LambdaTest/test-results-realdevice.json"
          if [ -f "$RESULTS_FILE" ]; then
            PASSED="$(node -pe "JSON.parse(require('fs').readFileSync('$RESULTS_FILE')).passed")"
            FAILED="$(node -pe "JSON.parse(require('fs').readFileSync('$RESULTS_FILE')).failed")"
          else
            PASSED="unknown"
            FAILED="unknown"
          fi
          echo "TESTS_PASSED=$PASSED" >> $GITHUB_ENV
          echo "TESTS_FAILED=$FAILED" >> $GITHUB_ENV

      - name: Log success
        if: ${{ success() }}
        run: echo "[ RUNNER ] - successfully executed mobile-views-2 iOS tests on real device (passed=$TESTS_PASSED, failed=$TESTS_FAILED)"

      - name: Log failure
        if: ${{ failure() || cancelled() }}
        run: echo "[ RUNNER ] - failed to execute mobile-views-2 iOS tests on real device (passed=$TESTS_PASSED, failed=$TESTS_FAILED)"

      - name: Notify failure
        if: ${{ failure() || cancelled() }}
        uses: slackapi/slack-github-action@485a9d42d3a73031f12ec201c457e2162c45d02d # pin@v2
        with:
          webhook-type: incoming-webhook
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          payload: |
            blocks:
              - type: "header"
                text:
                  type: "plain_text"
                  text: ":rotating_light: iOS LambdaTest Real Device Run Failed (mobile-views-2)"
              - type: "divider"
              - type: "section"
                text:
                  type: "mrkdwn"
                  text: "*Branch:* mobile-views-2\n*Target:* real device\n*Passed:* ${{ env.TESTS_PASSED }}\n*Failed:* ${{ env.TESTS_FAILED }}"
                accessory:
                  type: "button"
                  text:
                    type: "plain_text"
                    text: "View logs"
                    emoji: true
                  value: "view_logs"
                  url: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                  action_id: "button-action"
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
