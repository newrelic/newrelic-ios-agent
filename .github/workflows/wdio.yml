# The purpose of this GitHub action is to have a constant stream of data reporting to the following entities:
# NRTestApp-Auto: TBAdded

# This is accomplished by triggering npm scripts that execute a suite of tests in parallel
# The tests spin up simulated iOS and Android devices on LambdaTest that are instrumented with the Mobile agent

name: "WDIO: automate iOS tests"

permissions:
  contents: read

on:
  # enables option for workflow to be manually executed in Github UI
  workflow_dispatch:

  # Automatically trigger after uploadApp workflow completes successfully
  workflow_run:
    workflows: ["Upload iOS NRTestApp to LambdaTest"]
    types:
      - completed

  # enables scheduled execution every 30 minutes
  # schedule:
  #   - cron: "*/30 * * * *"

jobs:
  ios-data:
    name: Generate iOS data
    runs-on: ubuntu-latest
    # Only run if manually triggered from develop, or if trusted uploadApp workflow_run succeeded from develop
    # (uploadApp.yml is triggered by workflow_dispatch/push/schedule, so we don't gate on the upstream event type)
    if: ${{ (github.event_name == 'workflow_dispatch') || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') }}
    env:
      LT_USERNAME: ${{ secrets.LAMBDA_USERNAME }}
      LT_ACCESSKEY: ${{ secrets.LAMBDA_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: develop
      - name: Setup environment
        uses: ./.github/actions/env-setup

      - name: Download LambdaTest app ID artifact (from workflow_run)
        if: github.event_name == 'workflow_run'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const artifacts = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.payload.workflow_run.id,
            });
            const matchArtifact = artifacts.data.artifacts.filter((artifact) => {
              return artifact.name == "lambdatest-app-id"
            })[0];
            if (matchArtifact) {
              const download = await github.rest.actions.downloadArtifact({
                owner: context.repo.owner,
                repo: context.repo.repo,
                artifact_id: matchArtifact.id,
                archive_format: 'zip',
              });
              const fs = require('fs');
              const path = require('path');
              const artifactDir = path.join(process.env.RUNNER_TEMP, 'artifacts');
              fs.mkdirSync(artifactDir, { recursive: true });
              fs.writeFileSync(path.join(artifactDir, 'app-id.zip'), Buffer.from(download.data));
            }

      - name: Extract app ID (from workflow_run)
        if: github.event_name == 'workflow_run'
        run: |
          if [ -f "${{ runner.temp }}/artifacts/app-id.zip" ]; then
            mkdir -p "${{ runner.temp }}/artifacts/LambdaTest"
            unzip -q "${{ runner.temp }}/artifacts/app-id.zip" -d "${{ runner.temp }}/artifacts/LambdaTest"
            echo "Extracted app ID from workflow_run artifact"
          fi
        continue-on-error: true

      - name: Download LambdaTest app ID artifact (from manual run)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: lambdatest-app-id
          path: ${{ runner.temp }}/artifacts/LambdaTest
        continue-on-error: true

      - name: Set LT_APP_ID environment variable
        run: |
          APP_ID_FILE="${{ runner.temp }}/artifacts/LambdaTest/last-app-id"
          if [ -f "$APP_ID_FILE" ]; then
            APP_ID="$(tr -d '\n' < "$APP_ID_FILE")"
            if echo "$APP_ID" | grep -Eq '^[A-Za-z0-9._:-]{1,200}$'; then
              echo "LT_APP_ID=$APP_ID" >> $GITHUB_ENV
              echo "Using app ID: $APP_ID"
            else
              echo "Artifact app ID is invalid; tests will use default app ID from config"
            fi
          else
            echo "No app ID artifact found, tests will use default app ID from config"
          fi

      - name: Execute iOS tests
        run: for i in {1..1}; do echo "test run $i"; npm run test:wdio-ios; done

      - name: Read test results
        if: ${{ always() }}
        run: |
          RESULTS_FILE="LambdaTest/test-results.json"
          if [ -f "$RESULTS_FILE" ]; then
            PASSED="$(node -pe "JSON.parse(require('fs').readFileSync('$RESULTS_FILE')).passed")"
            FAILED="$(node -pe "JSON.parse(require('fs').readFileSync('$RESULTS_FILE')).failed")"
          else
            PASSED="unknown"
            FAILED="unknown"
          fi
          echo "TESTS_PASSED=$PASSED" >> $GITHUB_ENV
          echo "TESTS_FAILED=$FAILED" >> $GITHUB_ENV

      - name: Log success
        if: ${{ success() }}
        run: echo "[ RUNNER ] - successfully executed iOS tests (passed=$TESTS_PASSED, failed=$TESTS_FAILED)"

      - name: Log failure
        if: ${{ failure() || cancelled() }}
        run: echo "[ RUNNER ] - failed to execute iOS tests (passed=$TESTS_PASSED, failed=$TESTS_FAILED)"

      # - name: Notify success
      #   if: ${{ success() }}
      #   uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
      #   with:
      #     webhook-type: incoming-webhook
      #     webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
      #     payload: |
      #       blocks:
      #         - type: "header"
      #           text:
      #             type: "plain_text"
      #             text: ":white_check_mark: iOS LambdaTest Run Complete"
      #         - type: "divider"
      #         - type: "section"
      #           text:
      #             type: "mrkdwn"
      #             text: "*Passed:* ${{ env.TESTS_PASSED }}\n*Failed:* ${{ env.TESTS_FAILED }}"
      #   env:
      #     SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Notify failure
        if: ${{ failure() || cancelled() }}
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          webhook-type: incoming-webhook
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          payload: |
            blocks:
              - type: "header"
                text:
                  type: "plain_text"
                  text: ":rotating_light: iOS LambdaTest Run Failed"
              - type: "divider"
              - type: "section"
                text:
                  type: "mrkdwn"
                  text: "*Passed:* ${{ env.TESTS_PASSED }}\n*Failed:* ${{ env.TESTS_FAILED }}"
                accessory:
                  type: "button"
                  text:
                    type: "plain_text"
                    text: "View logs"
                    emoji: true
                  value: "view_logs"
                  url: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                  action_id: "button-action"
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

