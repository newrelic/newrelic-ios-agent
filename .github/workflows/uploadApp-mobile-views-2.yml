# Copy of uploadApp.yml that builds and uploads NRTestApp from the `mobile-views-2`
# branch instead of `develop`, so the mobile-views work has its own always-fresh
# app on LambdaTest (LambdaTest expires uploads after 60 days).
#
# The upload script (LambdaTest/uploadAppToLambdaTest.mjs) stamps each custom_id
# with a timestamp, so this run never clobbers the develop upload.
#
# Note: this workflow deliberately keeps a different `name:` from uploadApp.yml so
# it does NOT trigger wdio.yml, which listens for workflow_run on
# "Upload iOS NRTestApp to LambdaTest" and checks out develop.

name: Upload iOS NRTestApp (mobile-views-2) to LambdaTest

permissions:
  contents: read
  actions: read

on:
 # enables option for workflow to be manually executed in Github UI
 workflow_dispatch:

 # Runs daily to build, upload, and refresh the LambdaTest app (which otherwise expires after 60 days)
 schedule:
   - cron: "41 7 * * *"

jobs:

  build-ios:
    name: Build iOS app
    runs-on: xcode-27

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: mobile-views-2
          submodules: true

      - name: Setup environment
        uses: ./.github/actions/env-setup

      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: "27.0"

      # before building iOS app, please set the main server, the crash server, and the app token secret
      # the plist to be modified is located at ./Test Harness/NRTestApp/NRAPI-Info.plist
      # the secret mapping is as follows secrets.NRTESTAPP_CRASH_COLLECTOR_ADDRESS , secrets.NRTESTAPP_MAIN_COLLECTOR_ADDRESS, secrets.NRTESTAPP_APP_TOKEN
      - name: Set plist secrets
        env:
          NRTESTAPP_CRASH_COLLECTOR_ADDRESS: ${{ secrets.NRTESTAPP_CRASH_COLLECTOR_ADDRESS }}
          NRTESTAPP_MAIN_COLLECTOR_ADDRESS: ${{ secrets.NRTESTAPP_MAIN_COLLECTOR_ADDRESS }}
          NRTESTAPP_APP_TOKEN: ${{ secrets.NRTESTAPP_APP_TOKEN }}
        run: |
          PLIST_PATH="./Test Harness/NRTestApp/NRAPI-Info.plist"
          /usr/libexec/PlistBuddy -c "Set :crashCollectorAddress ${NRTESTAPP_CRASH_COLLECTOR_ADDRESS}" "$PLIST_PATH"
          /usr/libexec/PlistBuddy -c "Set :collectorAddress ${NRTESTAPP_MAIN_COLLECTOR_ADDRESS}" "$PLIST_PATH"
          /usr/libexec/PlistBuddy -c "Set :NRAPIKey ${NRTESTAPP_APP_TOKEN}" "$PLIST_PATH"

      - name: Clean iOS app
        run: |
          xcodebuild clean -workspace Agent.xcworkspace -scheme NRTestApp -derivedDataPath "derived_build"

      - name: Build iOS app
        run: |
          xcodebuild build \
            -workspace Agent.xcworkspace -scheme NRTestApp \
            -configuration Release \
            -sdk iphonesimulator \
            -derivedDataPath "derived_build" \
            build

      - name: Compress iOS app
        run: |
          ls -al
          cd ./derived_build/Build/Products/Release-iphonesimulator/
          ls
          zip -r nrtestapp-ios.zip NRTestApp.app

      - name: Upload iOS app
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nrtestapp-ios
          path: ./derived_build//Build/Products/Release-iphonesimulator/nrtestapp-ios.zip
          compression-level: 0
          retention-days: 1

  upload-apps:
    name: Upload NRTestApp app to LT
    needs: [build-ios]
    runs-on: ubuntu-latest
    outputs:
      # Handed to the test workflow as a workflow_call input. Passing it in-run
      # like this avoids having the downstream workflow download an artifact from
      # this run, which is the "artifact poisoning" pattern security scanners flag.
      app_id: ${{ steps.app-id.outputs.app_id }}
    env:
      LT_USERNAME: ${{ secrets.LAMBDA_USERNAME }}
      LT_ACCESSKEY: ${{ secrets.LAMBDA_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: mobile-views-2

      - name: Setup environment
        uses: ./.github/actions/env-setup

      - name: Download iOS artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nrtestapp-ios
          path: ${{ github.workspace }}/builds

      - name: Run upload script
        run: node LambdaTest/uploadAppToLambdaTest.mjs

      # Read back the custom_id this run just wrote. Validated before it leaves
      # the job so a malformed value can't reach the downstream workflow.
      - name: Capture uploaded app ID
        id: app-id
        run: |
          APP_ID_FILE="LambdaTest/last-app-id"
          if [ ! -f "$APP_ID_FILE" ]; then
            echo "::error::upload script did not write $APP_ID_FILE"
            exit 1
          fi
          APP_ID="$(tr -d '\n' < "$APP_ID_FILE")"
          if ! printf '%s' "$APP_ID" | grep -Eq '^[A-Za-z0-9._:-]{1,200}$'; then
            echo "::error::uploaded app ID is not in the expected format"
            exit 1
          fi
          echo "app_id=$APP_ID" >> "$GITHUB_OUTPUT"
          echo "Captured app ID: $APP_ID"

      # Informational only - for humans debugging a run. Nothing consumes this;
      # the test workflow gets the ID via the job output above. Do not wire a
      # downstream workflow to download it (artifact poisoning).
      - name: Upload custom_id artifact
        if: ${{ success() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lambdatest-app-id
          path: LambdaTest/last-app-id
          retention-days: 1

      - name: Log success
        if: ${{ success() }}
        run: echo "[ RUNNER ] - successfully uploaded mobile-views-2 apps to LambdaTest"

      - name: Log failure
        if: ${{ failure() || cancelled() }}
        run: echo "[ RUNNER ] - failed to upload mobile-views-2 apps to LambdaTest"

      - name: Notify failure
        if: ${{ failure() || cancelled() }}
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          webhook-type: incoming-webhook
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          payload: |
            blocks:
              - type: "header"
                text:
                  type: "plain_text"
                  text: ":crying-sunglasses-cowboy: LambdaTest Upload Failed (mobile-views-2)"
              - type: "divider"
              - type: "section"
                text:
                  type: "mrkdwn"
                  text: "Something went wrong while uploading the mobile-views-2 NRTestApp to LambdaTest. Please check the logs for more details."
                accessory:
                  type: "button"
                  text:
                    type: "plain_text"
                    text: "View logs"
                    emoji: true
                  value: "view_logs"
                  url: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                  action_id: "button-action"
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  run-tests:
    name: Run LambdaTest iOS suite
    needs: [upload-apps]
    uses: ./.github/workflows/wdio-mobile-views-2.yml
    secrets: inherit
    with:
      app_id: ${{ needs.upload-apps.outputs.app_id }}
