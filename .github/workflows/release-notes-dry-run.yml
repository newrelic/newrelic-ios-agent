name: Release notes - dry run (delete before merging)

# Temporary: tries the shared actions on this PR, at newrelic-android-agent#664's branch until it
# merges (the real callers use @develop). Nothing on docs-website changes.

on:
  pull_request:

permissions:
  contents: write # POST /releases/generate-notes needs it
  pull-requests: read

jobs:
  dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: newrelic/newrelic-android-agent/.github/actions/release-notes/generate@release-notes-template
        with:
          version: 7.7.10
          release-date: published
          dry-run: true
          fork-pat: ${{ secrets.BOT_FORK_PAT }}
      - uses: newrelic/newrelic-android-agent/.github/actions/release-notes/append@release-notes-template
        with:
          pr-number: 957
          dry-run: true
      - uses: newrelic/newrelic-android-agent/.github/actions/release-notes/check@release-notes-template
        with:
          dry-run: true
