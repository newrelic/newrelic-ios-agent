name: ArchiveNRTestApp

# Pre-release sanity check: can NRTestApp actually be archived and accepted by
# App Store Connect with the just-built agent? Catches signing, entitlement,
# arch-slice, Info.plist privacy, and ITMS-90xxx issues before we publish the
# podspec/SPM manifests.
#
# Two ways to run:
#   - workflow_call:     invoked from main.yml after the staging xcframework deploys.
#   - workflow_dispatch: trigger manually from any branch via the Actions UI for
#                        debugging signing/profile/secrets without pushing to staging.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  archive:
    name: Archive + validate NRTestApp
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.2"

      - name: Install Apple distribution certificate and provisioning profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          APP_STORE_PROVISION_PROFILE_BASE64: ${{ secrets.APP_STORE_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          PP_PATH=$RUNNER_TEMP/NRTestApp_AppStore.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH
          echo -n "$APP_STORE_PROVISION_PROFILE_BASE64" | base64 --decode -o $PP_PATH

          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          security import $CERTIFICATE_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

          PROFILE_PLIST=$(security cms -D -i $PP_PATH)
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c "Print :Name" /dev/stdin <<< "$PROFILE_PLIST")
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" /dev/stdin <<< "$PROFILE_PLIST")
          # PlistBuddy exits 0 even when the key is missing, so check explicitly --
          # otherwise an undecodable profile installs as a dotfile and the archive
          # fails much later with an unrelated-looking signing error.
          if [ -z "$PROFILE_NAME" ] || [ -z "$PROFILE_UUID" ]; then
            echo "::error::Could not read Name/UUID from the provisioning profile; check APP_STORE_PROVISION_PROFILE_BASE64."
            exit 1
          fi
          echo "PROFILE_NAME=$PROFILE_NAME" >> $GITHUB_ENV
          echo "PROFILE_UUID=$PROFILE_UUID" >> $GITHUB_ENV

          # Install under the UUID filename (what Xcode itself does) into BOTH search
          # paths: Xcode 16+ reads UserData/Provisioning Profiles, older Xcode reads the
          # legacy MobileDevice path. Writing only the legacy path silently yields
          # "no profile matching ..." on newer toolchains.
          for PROFILE_DIR in \
            "$HOME/Library/MobileDevice/Provisioning Profiles" \
            "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$PROFILE_DIR"
            cp "$PP_PATH" "$PROFILE_DIR/$PROFILE_UUID.mobileprovision"
          done

          # Confirm signing material actually landed, so a failure later is legible.
          echo "Installed profile: $PROFILE_NAME ($PROFILE_UUID)"
          security find-identity -v -p codesigning $KEYCHAIN_PATH

      - name: Set NRTestApp plist secrets
        env:
          NRTESTAPP_CRASH_COLLECTOR_ADDRESS: ${{ secrets.NRTESTAPP_CRASH_COLLECTOR_ADDRESS }}
          NRTESTAPP_MAIN_COLLECTOR_ADDRESS: ${{ secrets.NRTESTAPP_MAIN_COLLECTOR_ADDRESS }}
          NRTESTAPP_APP_TOKEN: ${{ secrets.NRTESTAPP_APP_TOKEN }}
        run: |
          PLIST_PATH="./Test Harness/NRTestApp/NRAPI-Info.plist"
          /usr/libexec/PlistBuddy -c "Set :crashCollectorAddress ${NRTESTAPP_CRASH_COLLECTOR_ADDRESS}" "$PLIST_PATH"
          /usr/libexec/PlistBuddy -c "Set :collectorAddress ${NRTESTAPP_MAIN_COLLECTOR_ADDRESS}" "$PLIST_PATH"
          /usr/libexec/PlistBuddy -c "Set :NRAPIKey ${NRTESTAPP_APP_TOKEN}" "$PLIST_PATH"

      - name: Write ExportOptions.plist
        run: |
          cat > $RUNNER_TEMP/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>SU7SUNGZJP</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>stripSwiftSymbols</key><true/>
            <key>uploadSymbols</key><true/>
            <key>destination</key><string>export</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.newrelic.NRApp.bitcode</key>
              <string>${PROFILE_NAME}</string>
            </dict>
          </dict>
          </plist>
          EOF
          cat $RUNNER_TEMP/ExportOptions.plist

      - name: Archive NRTestApp
        run: |
          # Do NOT pass PROVISIONING_PROFILE_SPECIFIER here. Command-line build settings
          # apply to EVERY target in the build graph, and this archive pulls in JSON, Hex,
          # Utilities, Connectivity, Analytics, and Agent_iOS -- each of which fails with
          # "<target> does not support provisioning profiles". The NRTestApp target already
          # sets PROVISIONING_PROFILE_SPECIFIER[sdk=iphoneos*] = NRTestApp-AppStore.
          set +e   # so a non-zero pipeline doesn't abort before PIPESTATUS is read
          xcodebuild archive \
            -workspace Agent.xcworkspace \
            -scheme NRTestApp \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath $RUNNER_TEMP/NRTestApp.xcarchive \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM=SU7SUNGZJP \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            2>&1 | tee $RUNNER_TEMP/archive.log | xcpretty
          # Judge the build by xcodebuild's own status (PIPESTATUS[0]), never xcpretty's --
          # a broken/missing formatter must not decide whether the archive passed.
          STATUS=${PIPESTATUS[0]}
          set -e
          if [ "$STATUS" -ne 0 ]; then
            # xcpretty swallows code-signing errors, leaving only a bare
            # "Archiving workspace Agent with scheme NRTestApp (1 failure)" footer,
            # so always surface the raw log on failure.
            echo "::error::Archive failed (xcodebuild exit $STATUS) -- raw output below."
            echo "::group::error lines"
            grep -E "error:" $RUNNER_TEMP/archive.log || echo "(no 'error:' lines in log)"
            echo "::endgroup::"
            echo "::group::full xcodebuild output"
            cat $RUNNER_TEMP/archive.log
            echo "::endgroup::"
            exit "$STATUS"
          fi

      - name: Export IPA
        run: |
          set +e   # so a non-zero pipeline doesn't abort before PIPESTATUS is read
          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/NRTestApp.xcarchive \
            -exportOptionsPlist $RUNNER_TEMP/ExportOptions.plist \
            -exportPath $RUNNER_TEMP/export \
            -allowProvisioningUpdates \
            2>&1 | tee $RUNNER_TEMP/export.log | xcpretty
          STATUS=${PIPESTATUS[0]}
          set -e
          if [ "$STATUS" -ne 0 ]; then
            echo "::error::Export failed (xcodebuild exit $STATUS) -- raw output below."
            echo "::group::error lines"
            grep -E "error:" $RUNNER_TEMP/export.log || echo "(no 'error:' lines in log)"
            echo "::endgroup::"
            echo "::group::full xcodebuild output"
            cat $RUNNER_TEMP/export.log
            echo "::endgroup::"
            exit "$STATUS"
          fi
          ls -la $RUNNER_TEMP/export/

      - name: Install gems
        run: bundle install

      - name: Upload IPA to App Store Connect via Fastlane
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
        run: |
          set -o pipefail
          P8_PATH=$RUNNER_TEMP/AuthKey_${ASC_API_KEY_ID}.p8
          echo -n "$ASC_API_KEY_P8_BASE64" | base64 --decode -o "$P8_PATH"
          IPA_PATH=$(ls $RUNNER_TEMP/export/*.ipa | head -1)
          echo "Uploading $IPA_PATH to App Store Connect"
          # upload_to_testflight validates the package as part of upload, so this
          # replaces the previous altool --validate-app pre-flight step.
          bundle exec fastlane uploadNRTestApp ipa:"$IPA_PATH" key_path:"$P8_PATH"

      - name: Upload archive artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NRTestApp-prerelease-archive
          path: |
            ${{ runner.temp }}/NRTestApp.xcarchive
            ${{ runner.temp }}/export/*.ipa
            ${{ runner.temp }}/archive.log
            ${{ runner.temp }}/export.log
          retention-days: 7
          if-no-files-found: warn

      - name: Cleanup keychain and key
        if: always()
        run: |
          security delete-keychain $RUNNER_TEMP/app-signing.keychain-db || true
          rm -f $RUNNER_TEMP/AuthKey_*.p8 || true
